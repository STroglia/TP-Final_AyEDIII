{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="encabezado">
  <div>
    <h1>Cambiar contraseña</h1>
    <p>Por seguridad, primero confirmá tu contraseña actual.</p>
  </div>
</div>

<form method="post" class="tarjeta form-angosto" novalidate>
  {{ csrf() }}
  <div class="campo">
    <label for="actual">Contraseña actual <span class="requerido">*</span></label>
    <input id="actual" name="actual" type="password" autocomplete="current-password" required autofocus>
  </div>
  <div class="fila-campos">
    <div class="campo">
      <label for="nueva">Contraseña nueva <span class="requerido">*</span></label>
      <input id="nueva" name="nueva" type="password" minlength="6" autocomplete="new-password" required>
      <span class="ayuda">Mínimo 6 caracteres.</span>
    </div>
    <div class="campo">
      <label for="nueva2">Repetir contraseña nueva <span class="requerido">*</span></label>
      <input id="nueva2" name="nueva2" type="password" minlength="6" autocomplete="new-password" required>
    </div>
  </div>

  <div class="acciones-form">
    <a class="btn btn-secundario" href="{{ url_for('panel.inicio') }}">Cancelar</a>
    <button class="btn btn-primario" type="submit">{{ icono("check") }} Guardar contraseña</button>
  </div>
</form>
{% endblock %}
